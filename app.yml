version: 2

name: COMPLIANCE_WORKSTATION
database: AUDIT_APP_DB
schema: APP_SCHEMA
query_warehouse: COMPUTE_WH

label: "TBOM Compliance Workstation"
description: "RSM audit evidence export, recurring compliance reviews with dual sign-off, and visual audit trail."
icon: public/icon.svg

install:
  commands:
    - ["npm", "ci", "--include=dev"]
    - ["npm", "run", "build"]

run:
  command: ["npm", "run", "start"]

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - app.yml.build
